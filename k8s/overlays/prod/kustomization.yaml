apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - namespace.yaml
  - ../../base
  - pdb.yaml

patches:
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: frontend

  # `prod` hides the seed-account shortcuts on the login screen.
  - target:
      kind: ConfigMap
      name: frontend-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: "prod"

  # A rollout that never takes a pod away before its replacement is Ready.
  # The HPA owns the replica count; keep prod spread across availability zones.
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app: frontend

  - target:
      kind: HorizontalPodAutoscaler
      name: frontend
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 6
