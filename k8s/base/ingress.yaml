apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: default
  annotations:
    # Triggers AWS to provision an Application Load Balancer
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    
    # Routes traffic straight to your EKS worker node EC2 instances
    alb.ingress.kubernetes.io/target-type: instance
    
    # Health check endpoints for Nginx
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend   # Must exactly match your Service name
                port:
                  number: 80  # Must exactly match your Service port
