apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  # No `replicas:` here on purpose. The HorizontalPodAutoscaler (hpa.yaml) owns
  # the replica count. If this field were set, every `kubectl apply` would reset
  # the HPA's current scale back to this number on each deploy.
  # The floor and ceiling per environment are minReplicas/maxReplicas in hpa.yaml.

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Replaced at deploy time, per environment:
          #   kubectl kustomize k8s/overlays/<env> \
          #     | sed "s|IMAGE_PLACEHOLDER|$IMAGE|g" | kubectl apply -f -
          #
          # The pipeline fails the job if the placeholder is still present
          # after the sed, so a literal IMAGE_PLACEHOLDER (ImagePullBackOff)
          # can never reach the cluster.
          image: IMAGE_PLACEHOLDER

          ports:
            # Named, so the Service and both probes refer to it by name.
            - name: http
              containerPort: 3000

          # Every key in the ConfigMap becomes an environment variable, which
          # docker-entrypoint.sh renders into runtime-config.js at start.
          #
          # Editing the ConfigMap alone does NOT restart this pod - the
          # Deployment has not changed, so Kubernetes leaves it running with the
          # old values. Try it and watch nothing happen.
          envFrom:
            - configMapRef:
                name: frontend-config

          # Is the container alive? If not, restart it.
          # /healthz, not /, because it answers without touching the filesystem
          # and is excluded from the access log.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10

          # Is it ready for traffic? If not, keep it out of the Service.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5

          # The HPA scales on this container's CPU as a percentage of the CPU
          # *request* below, so the request is the scaling yardstick: 70% of 50m
          # is 35m per pod. Tune it after a load test. No CPU limit on purpose
          # (CPU limits throttle nginx and distort the autoscaling signal).
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 192Mi

        # Sidecar that turns nginx's stub_status (served on 127.0.0.1:8080, see
        # nginx.conf) into Prometheus metrics on :9113. Prometheus scrapes it via
        # the ServiceMonitor in monitoring/app. It shares the pod's network
        # namespace, which is why it can reach nginx on localhost.
        #
        # Trade-off: a pod is Ready only when ALL its containers are running, so a
        # crashing exporter would take the pod out of the Service. It is tiny and
        # stable, but alert on pod restarts (monitoring/app/prometheusrule.yaml).
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.5.3
          args:
            - --nginx.scrape-uri=http://127.0.0.1:8080/stub_status
          ports:
            - name: metrics
              containerPort: 9113
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
