name: Production CD

on:

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-2
  EKS_CLUSTER_NAME: eks-cluster
  ECR_REPOSITORY: prod-eks-frontend

jobs:

  # ======================================================
  # 1. PRODUCTION CI
  # ======================================================

  ci:
    name: Production CI
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      # -----------------------------------------------
      # Python
      # -----------------------------------------------

      - name: Setup Python
        if: hashFiles('requirements.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # -----------------------------------------------
      # Dependencies
      # -----------------------------------------------

      - name: Install dependencies
        run: |

          if [ -f requirements.txt ]; then

            python -m pip install --upgrade pip
            pip install -r requirements.txt

          fi

      # -----------------------------------------------
      # Tests
      # -----------------------------------------------

      - name: Install pytest
        run: |

          if [ -d tests ]; then
            pip install pytest
          fi

      - name: Run tests
        run: |

          if [ -d tests ]; then

            pytest -v

          else

            echo "No automated tests configured"

          fi

      # -----------------------------------------------
      # Docker validation
      # -----------------------------------------------

      - name: Docker build validation
        run: |
          docker build \
            -t production-validation:${{ github.sha }} .

  # ======================================================
  # 2. SONARCLOUD
  # ======================================================

  sonar:
    name: Production SonarCloud
    runs-on: ubuntu-latest

    needs:
      - ci

    steps:

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # ======================================================
  # 3. BUILD AND PUSH PRODUCTION IMAGE
  # ======================================================

  docker:
    name: Production Docker Build
    runs-on: ubuntu-latest

    needs:
      - ci
      - sonar

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      # -----------------------------------------------
      # AWS OIDC
      # -----------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      # -----------------------------------------------
      # ECR
      # -----------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # -----------------------------------------------
      # Build
      # -----------------------------------------------

      - name: Build Docker image
        run: |

          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} .

      # -----------------------------------------------
      # Push
      # -----------------------------------------------

      - name: Push Docker image
        run: |

          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

  # ======================================================
  # 4. PRODUCTION APPROVAL + DEPLOYMENT
  # ======================================================

  deploy-production:
    name: Production Deployment

    needs:
      - ci
      - sonar
      - docker

    runs-on: ubuntu-latest

    # ==================================================
    # MANUAL APPROVAL
    # ==================================================

    environment:
      name: production

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      # -----------------------------------------------
      # AWS
      # -----------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      # -----------------------------------------------
      # ECR
      # -----------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # -----------------------------------------------
      # EKS
      # -----------------------------------------------

      - name: Configure EKS
        run: |

          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      # -----------------------------------------------
      # Deploy
      # -----------------------------------------------

      - name: Deploy application
        run: |

          kubectl apply -f k8s/

      # -----------------------------------------------
      # Update image
      # -----------------------------------------------

      - name: Update production image
        run: |

          kubectl set image deployment/frontend \
            frontend=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # -----------------------------------------------
      # Rollout
      # -----------------------------------------------

      - name: Wait for production rollout
        run: |

          kubectl rollout status \
            deployment/frontend \
            --timeout=300s

      # -----------------------------------------------
      # Verify pods
      # -----------------------------------------------

      - name: Verify production pods
        run: |

          kubectl get pods -o wide

      # -----------------------------------------------
      # Get production ALB
      # -----------------------------------------------

      - name: Get production ALB
        id: alb
        run: |

          for i in {1..20}; do

            ALB_URL=$(kubectl get ingress frontend-ingress \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

            if [ -n "$ALB_URL" ]; then
              break
            fi

            echo "Waiting for production ALB..."
            sleep 15

          done

          if [ -z "$ALB_URL" ]; then

            kubectl describe ingress frontend-ingress
            exit 1

          fi

          echo "ALB_URL=http://$ALB_URL" >> "$GITHUB_ENV"

          echo "Production ALB: $ALB_URL"

      # -----------------------------------------------
      # Production health check
      # -----------------------------------------------

      - name: Production health check
        run: |

          for i in {1..10}; do

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              "$ALB_URL/health"; then

              echo "Production health check PASSED"
              exit 0

            fi

            echo "Production application not ready..."
            sleep 10

          done

          echo "Production health check FAILED"

          kubectl get pods -o wide
          kubectl describe deployment frontend

          exit 1

      # -----------------------------------------------
      # Final smoke test
      # -----------------------------------------------

      - name: Production smoke test
        run: |

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 10 \
            "$ALB_URL/"

          echo "Production deployment successful"